services:
  postgres:
    image: postgres:16-alpine
    environment:
      # Local-only default. The published port is 127.0.0.1. Do not reuse this
      # password for a database that is reachable beyond localhost.
      POSTGRES_USER: messenger
      POSTGRES_PASSWORD: messenger
      POSTGRES_DB: messenger
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U messenger -d messenger"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    pull_policy: build
    build:
      context: ./backend
    env_file:
      - path: ./backend/.env
        required: false
    command: sh -c "npx prisma db push && npx tsx watch src/index.ts"
    environment:
      DATABASE_URL: postgresql://messenger:messenger@postgres:5432/messenger
      REDIS_URL: redis://redis:6379
      # Local secrets come from the gitignored repo-root `.env`. Compose fails
      # closed when they are missing. Do not put generated values in this file.
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the repo-root .env (see .env.example)}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:?Set TOTP_ENCRYPTION_KEY in the repo-root .env (see .env.example)}
      PORT: 3001
      # Leave empty locally. Never set true.
      TRUST_PROXY: ${TRUST_PROXY:-}
      # Literal localhost previously ignored root `.env`; interpolate so host/.env can override.
      # Prod overlay defaults FRONTEND_ORIGIN to https://sophia.apps.grok.bot (docker-compose.prod.yml).
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
      COOKIE_NAME: messenger_session
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      GROUP_E2EE_ENABLED: ${GROUP_E2EE_ENABLED:-true}
      SAFETY_NUMBERS_ENABLED: ${SAFETY_NUMBERS_ENABLED:-true}
      # Daily brief stays on unless this is exactly false.
      DAILY_BRIEF_ENABLED: ${DAILY_BRIEF_ENABLED:-true}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      # Billing stays off. mock never calls a provider. See docs/billing.md.
      BILLING_ENABLED: ${BILLING_ENABLED:-false}
      BILLING_PROVIDER: ${BILLING_PROVIDER:-mock}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_FAMILY_PLUS: ${STRIPE_PRICE_FAMILY_PLUS:-}
      STRIPE_PRICE_TEAM_SEAT: ${STRIPE_PRICE_TEAM_SEAT:-}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
      PAYPAL_ENV: ${PAYPAL_ENV:-sandbox}
      PAYPAL_WEBHOOK_ID: ${PAYPAL_WEBHOOK_ID:-}
      PAYPAL_PLAN_FAMILY_PLUS: ${PAYPAL_PLAN_FAMILY_PLUS:-}
      PAYPAL_PLAN_TEAM_SEAT: ${PAYPAL_PLAN_TEAM_SEAT:-}
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - ./backend/src:/app/src
      - ./backend/prisma:/app/prisma
      - ./backend/prisma.config.ts:/app/prisma.config.ts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:3001/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  frontend:
    pull_policy: build
    build:
      context: ./frontend
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0"
    env_file:
      - path: ./frontend/.env.local
        required: false
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NEXT_PUBLIC_GROUP_E2EE_ENABLED: ${NEXT_PUBLIC_GROUP_E2EE_ENABLED:-true}
      # Adaptive appearance stays on unless this is exactly false.
      NEXT_PUBLIC_ADAPTIVE_THEME_ENABLED: ${NEXT_PUBLIC_ADAPTIVE_THEME_ENABLED:-true}
      # Safety numbers stay on unless this is exactly false.
      NEXT_PUBLIC_SAFETY_NUMBERS_ENABLED: ${NEXT_PUBLIC_SAFETY_NUMBERS_ENABLED:-true}
      # Daily brief stays on unless this is exactly false.
      NEXT_PUBLIC_DAILY_BRIEF_ENABLED: ${NEXT_PUBLIC_DAILY_BRIEF_ENABLED:-true}
      WATCHPACK_POLLING: "true"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  frontend_node_modules:
  frontend_next:
