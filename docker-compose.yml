services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: messenger
      POSTGRES_PASSWORD: messenger
      POSTGRES_DB: messenger
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U messenger -d messenger"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    pull_policy: build
    build:
      context: ./backend
    env_file:
      - path: ./backend/.env
        required: false
    command: sh -c "npx prisma db push && npx tsx watch src/index.ts"
    environment:
      DATABASE_URL: postgresql://messenger:messenger@postgres:5432/messenger
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev-secret-key-for-local-messenger-1234
      TOTP_ENCRYPTION_KEY: 1f8364077a753ad2e85819ea23a046bb54b4ed2ad14c393f2f8cb4f5d2c9b611
      PORT: 3001
      # Literal localhost previously ignored root `.env`; interpolate so host/.env can override.
      # Prod overlay requires FRONTEND_ORIGIN explicitly (docker-compose.prod.yml).
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
      COOKIE_NAME: messenger_session
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - ./backend/src:/app/src
      - ./backend/prisma:/app/prisma
      - ./backend/prisma.config.ts:/app/prisma.config.ts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:3001/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  frontend:
    pull_policy: build
    build:
      context: ./frontend
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0"
    env_file:
      - path: ./frontend/.env.local
        required: false
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
      WATCHPACK_POLLING: "true"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  frontend_node_modules:
  frontend_next:
