services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    environment:
      DATABASE_URL: postgresql://messenger:messenger@postgres:5432/messenger
      REDIS_URL: redis://redis:6379
      # Required secrets — put in repo-root `.env` (Compose interpolates the whole
      # merged file even when you `build` / `up` only `backend`).
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in repo-root .env before starting production}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:?Set TOTP_ENCRYPTION_KEY in repo-root .env before starting production}
      PORT: 3001
      NODE_ENV: production
      # Empty ignores X-Forwarded-*. Set this to the reverse proxy IP or CIDR
      # (for example 10.0.0.0/8). The value true is rejected at startup.
      TRUST_PROXY: ${TRUST_PROXY:-}
      # Defaults to the live Sophia SPA origin. Override via root `.env` if the
      # published frontend origin changes. `backend/.env` / env_file does NOT
      # supply this key when `environment:` sets it.
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-https://sophia.apps.grok.bot}
      COOKIE_NAME: messenger_session
      # Always Secure+SameSite=None in prod. Do NOT interpolate from root `.env`:
      # `cp backend/.env .` copies COOKIE_SECURE=false and would keep Lax cookies,
      # which browsers refuse to send on cross-site SPA→API fetch.
      COOKIE_SECURE: "true"
      # Mail/calendar sends stay off unless the operator opts in. An allowlist
      # (user id, username, or email) further limits that opt-in to one account.
      # The allowlist does nothing while the flag is false.
      INTEGRATIONS_WRITE_ENABLED: ${INTEGRATIONS_WRITE_ENABLED:-false}
      SAFETY_NUMBERS_ENABLED: ${SAFETY_NUMBERS_ENABLED:-true}
      # Daily brief stays on unless this is exactly false. Writes stay off above.
      DAILY_BRIEF_ENABLED: ${DAILY_BRIEF_ENABLED:-true}
      INTEGRATIONS_WRITE_ALLOWLIST: ${INTEGRATIONS_WRITE_ALLOWLIST:-}
      GMAIL_CLIENT_ID: ${GMAIL_CLIENT_ID-}
      GMAIL_CLIENT_SECRET: ${GMAIL_CLIENT_SECRET-}
      GMAIL_REFRESH_TOKEN: ${GMAIL_REFRESH_TOKEN-}
      GMAIL_SENDER: ${GMAIL_SENDER-}
      BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY-}
      SOPHIA_MODEL_API_KEY: ${SOPHIA_MODEL_API_KEY-}
      SOPHIA_MODEL_BASE_URL: ${SOPHIA_MODEL_BASE_URL-}
      SOPHIA_MODEL_NAME: ${SOPHIA_MODEL_NAME-}
      SAFE_BROWSING_API_KEY: ${SAFE_BROWSING_API_KEY-}
      TURN_URLS: ${TURN_URLS-}
      TURN_SHARED_SECRET: ${TURN_SHARED_SECRET-}
      B2_ENDPOINT: ${B2_ENDPOINT-}
      B2_REGION: ${B2_REGION-}
      B2_BUCKET: ${B2_BUCKET-}
      B2_KEY_ID: ${B2_KEY_ID-}
      B2_APPLICATION_KEY: ${B2_APPLICATION_KEY-}
    volumes: []

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        # Optional default so API-only VM builds (`… build backend`) do not abort
        # when Compose still interpolates the frontend service block.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.sophia-build.com}
        NEXT_PUBLIC_SAFETY_NUMBERS_ENABLED: ${NEXT_PUBLIC_SAFETY_NUMBERS_ENABLED:-true}
        NEXT_PUBLIC_DAILY_BRIEF_ENABLED: ${NEXT_PUBLIC_DAILY_BRIEF_ENABLED:-true}
    environment: []
    volumes: []
