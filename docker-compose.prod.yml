services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    environment:
      DATABASE_URL: postgresql://messenger:messenger@postgres:5432/messenger
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET before starting production}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:?Set TOTP_ENCRYPTION_KEY before starting production}
      PORT: 3001
      # Must come from the host environment or repo-root `.env` (Compose interpolation).
      # `backend/.env` / env_file does NOT supply this key when `environment:` sets it.
      # After `cp backend/.env .`, edit FRONTEND_ORIGIN — the example value is localhost.
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:?Set FRONTEND_ORIGIN before starting production}
      COOKIE_NAME: messenger_session
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      GMAIL_CLIENT_ID: ${GMAIL_CLIENT_ID-}
      GMAIL_CLIENT_SECRET: ${GMAIL_CLIENT_SECRET-}
      GMAIL_REFRESH_TOKEN: ${GMAIL_REFRESH_TOKEN-}
      GMAIL_SENDER: ${GMAIL_SENDER-}
      BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY-}
      SAFE_BROWSING_API_KEY: ${SAFE_BROWSING_API_KEY-}
      TURN_URLS: ${TURN_URLS-}
      TURN_SHARED_SECRET: ${TURN_SHARED_SECRET-}
      B2_ENDPOINT: ${B2_ENDPOINT-}
      B2_REGION: ${B2_REGION-}
      B2_BUCKET: ${B2_BUCKET-}
      B2_KEY_ID: ${B2_KEY_ID-}
      B2_APPLICATION_KEY: ${B2_APPLICATION_KEY-}
    volumes: []

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?Set NEXT_PUBLIC_API_URL before starting production}
    environment: []
    volumes: []
